<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPG Replay Engine</title>
<style>
  :root {
    --bg: #15171c; --panel: #1e2128; --line: #2c3039; --text: #e7e9ee; --dim: #8b919e;
    --accent: #3d8bfd; --rec: #e5484d; --live: #30a46c; --warn: #f5a524;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  .pill { padding: 3px 8px; border-radius: 999px; background: #2a2e37; color: var(--dim); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .pill.rec { background: var(--rec); color: #fff; }
  .pill.live { background: var(--live); color: #fff; }
  .pill.replay { background: var(--accent); color: #fff; }
  .time { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; margin-left: auto; }
  main { padding: 8px; display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 6px; }
  button { height: 44px; border: 1px solid var(--line); border-radius: 6px; background: #262a33; color: var(--text); font: 600 13px system-ui, "Segoe UI", sans-serif; cursor: pointer; }
  button:hover { border-color: #4a505c; }
  button:active { transform: translateY(1px); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.recbtn.on { background: var(--rec); border-color: var(--rec); }
  button.livebtn.on { background: var(--live); border-color: var(--live); }
  h2 { margin: 4px 0 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .msg { padding: 6px 8px; border-radius: 6px; background: #2b2416; color: var(--warn); display: none; }
  .msg.show { display: block; }
  .info { color: var(--dim); font-size: 12px; }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
  label { display: grid; gap: 3px; margin: 8px 0; color: var(--dim); font-size: 12px; }
  select, input { height: 32px; border-radius: 6px; border: 1px solid var(--line); background: #12141a; color: var(--text); padding: 0 8px; font: inherit; }
  .save { width: 100%; margin-top: 4px; background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<header>
  <span id="recPill" class="pill">STOPPED</span>
  <span id="modePill" class="pill">REPLAY</span>
  <span id="camPill" class="pill">CAM 1</span>
  <span id="speedPill" class="pill">100%</span>
  <span id="time" class="time">00:00.00</span>
</header>

<main>
  <div id="msg" class="msg"></div>

  <div class="row">
    <button id="recBtn" class="recbtn" data-cmd="record/toggle">REC</button>
    <button id="liveBtn" class="livebtn" data-cmd="live">LIVE</button>
    <button id="playBtn" data-cmd="play">PLAY</button>
    <button id="pauseBtn" data-cmd="pause">PAUSE</button>
  </div>

  <h2>Camera</h2>
  <div class="row">
    <button data-cam="1" data-cmd="camera/1">CAM 1</button>
    <button data-cam="2" data-cmd="camera/2">CAM 2</button>
    <button data-cam="3" data-cmd="camera/3">CAM 3</button>
    <button data-cam="4" data-cmd="camera/4">CAM 4</button>
  </div>

  <h2>Speed</h2>
  <div class="row">
    <button data-speed="25" data-cmd="speed/25">25%</button>
    <button data-speed="50" data-cmd="speed/50">50%</button>
    <button data-speed="100" data-cmd="speed/100">100%</button>
    <button id="audioBtn" data-cmd="audio-mode/next">AUDIO</button>
  </div>
  <div class="info" id="audioInfo"></div>

  <h2>Step</h2>
  <div class="row">
    <button data-cmd="step/seconds/-1">−1 s</button>
    <button data-cmd="step/frames/-1">−1 F</button>
    <button data-cmd="step/frames/1">+1 F</button>
    <button data-cmd="step/seconds/1">+1 s</button>
  </div>

  <div class="info" id="playerInfo"></div>

  <details id="setup">
    <summary>Setup</summary>
    <label>Camera 1 <select data-camsel="0"></select></label>
    <label>Camera 2 <select data-camsel="1"></select></label>
    <label>Camera 3 <select data-camsel="2"></select></label>
    <label>Camera 4 <select data-camsel="3"></select></label>
    <label>Recording folder <input id="dir" type="text" spellcheck="false"></label>
    <label>Video bitrate per camera (kbps) <input id="vbr" type="number" min="5000" max="150000" step="1000"></label>
    <button class="save" id="saveBtn">Save setup</button>
    <p class="info">Add the <b>RPG Replay Player</b> source to your Replay scene in OBS. For each camera
      source, turn off "Deactivate when not showing" if it has that option, so it keeps sending video.</p>
  </details>
</main>

<script>
const AUDIO_LABELS = {
  follow: "Slow-mo audio: follow speed (pitch drops)",
  preserve: "Slow-mo audio: preserve pitch",
  mute: "Slow-mo audio: muted below 100%"
};
const $ = (id) => document.getElementById(id);

function showMsg(text) {
  const m = $("msg");
  m.textContent = text || "";
  m.classList.toggle("show", !!text);
}

async function send(cmd) {
  try {
    const r = await fetch("/api/" + cmd, { method: "POST" });
    const j = await r.json();
    showMsg(j.ok ? "" : j.error);
  } catch (e) {
    showMsg("OBS is not responding. Is OBS running with RPG Replay Engine?");
  }
  poll();
}

document.querySelectorAll("button[data-cmd]").forEach((b) =>
  b.addEventListener("click", () => send(b.dataset.cmd)));

function fmt(t) {
  t = Math.max(0, t || 0);
  const m = Math.floor(t / 60), s = t - m * 60;
  return String(m).padStart(2, "0") + ":" + s.toFixed(2).padStart(5, "0");
}

async function poll() {
  let s;
  try {
    s = await (await fetch("/api/status")).json();
  } catch (e) {
    $("recPill").textContent = "OFFLINE";
    $("recPill").className = "pill";
    return;
  }
  $("recPill").textContent = s.recording ? "● REC" : "STOPPED";
  $("recPill").className = "pill" + (s.recording ? " rec" : "");
  $("modePill").textContent = s.live ? "LIVE" : (s.playing ? "PLAYING" : "PAUSED");
  $("modePill").className = "pill " + (s.live ? "live" : "replay");
  $("camPill").textContent = "CAM " + s.camera;
  $("speedPill").textContent = s.speed + "%";
  const behind = s.head - s.position;
  $("time").textContent = fmt(s.position) + (s.head ? "  /  −" + behind.toFixed(1) + " s" : "");

  $("recBtn").classList.toggle("on", s.recording);
  $("liveBtn").classList.toggle("on", s.live);
  $("playBtn").classList.toggle("on", s.playing && !s.live);
  $("pauseBtn").classList.toggle("on", !s.playing);
  document.querySelectorAll("[data-cam]").forEach((b) => b.classList.toggle("on", +b.dataset.cam === s.camera));
  document.querySelectorAll("[data-speed]").forEach((b) => b.classList.toggle("on", +b.dataset.speed === s.speed));
  $("audioInfo").textContent = AUDIO_LABELS[s.audio_mode] || "";
  $("playerInfo").textContent = s.player_status + (s.last_error ? "  •  " + s.last_error : "");
}

async function loadSetup() {
  const [src, cfg] = await Promise.all([
    fetch("/api/sources").then((r) => r.json()),
    fetch("/api/config").then((r) => r.json()),
  ]);
  const names = (src.sources || []).map((x) => x.name).sort((a, b) => a.localeCompare(b));
  document.querySelectorAll("[data-camsel]").forEach((sel) => {
    const i = +sel.dataset.camsel;
    const current = (cfg.cameras && cfg.cameras[i] && cfg.cameras[i].source) || "";
    sel.innerHTML = "";
    const none = new Option("(not used)", "");
    sel.add(none);
    names.forEach((n) => sel.add(new Option(n, n)));
    if (current && !names.includes(current)) sel.add(new Option(current + " (missing)", current));
    sel.value = current;
  });
  $("dir").value = cfg.record_dir || "";
  $("vbr").value = cfg.video_bitrate_kbps || 50000;
}

$("setup").addEventListener("toggle", () => { if ($("setup").open) loadSetup(); });

$("saveBtn").addEventListener("click", async () => {
  const cameras = [...document.querySelectorAll("[data-camsel]")].map((s) => ({ source: s.value }));
  const body = { cameras, record_dir: $("dir").value.trim(), video_bitrate_kbps: +$("vbr").value };
  const r = await fetch("/api/config", { method: "POST", body: JSON.stringify(body), headers: { "Content-Type": "application/json" } });
  const j = await r.json();
  showMsg(j.ok ? "" : j.error);
  if (j.ok) $("saveBtn").textContent = "Saved ✓";
  setTimeout(() => ($("saveBtn").textContent = "Save setup"), 1500);
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const keys = { " ": null, "1": "camera/1", "2": "camera/2", "3": "camera/3", "4": "camera/4",
    "l": "live", "r": "record/toggle", "ArrowLeft": "step/frames/-1", "ArrowRight": "step/frames/1" };
  if (e.key === " ") { e.preventDefault(); send($("pauseBtn").classList.contains("on") ? "play" : "pause"); return; }
  if (keys[e.key]) { e.preventDefault(); send(keys[e.key]); }
});

poll();
setInterval(poll, 250);
</script>
</body>
</html>
